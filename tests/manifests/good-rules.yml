---
name: ((deployment))
releases:
  - name: syslog
    version: latest
stemcells:
  - alias: default
    os: ((stemcell-os))
    version: latest
instance_groups:
  - name: forwarder
    instances: 1
    vm_type: ((vm-type))
    stemcell: default
    networks:
      - name: ((network))
    azs:
      - ((az))
    jobs:
      - name: syslog_forwarder
        release: syslog
    properties:
      syslog:
        custom_rule: |
          if ($msg contains "DEBUG") then stop
        custom_apparmor_rules: |
          /var/vcap/data/syslog_forwarder/** rw,
          /var/vcap/sys/log/syslog_forwarder/** rw,
  - name: storer
    instances: 1
    vm_type: ((vm-type))
    stemcell: default
    networks:
      - name: ((network))
    azs:
      - ((az))
    jobs:
      - name: syslog_storer
        release: syslog
update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 1000-60000
  update_watch_time: 1000-60000
